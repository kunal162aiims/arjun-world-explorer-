<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1263a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arjun World">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Arjun's World Explorer</title>
<style>
:root{
  --blue:#1464d2;--blue2:#0b3b91;--sky:#eaf4ff;--ink:#10243e;--muted:#687a91;
  --card:#fff;--gold:#ffbf3f;--green:#159b62;--red:#d94b4b;--line:#dbe6f2;
  --shadow:0 8px 28px rgba(24,63,110,.11)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#edf6ff 0,#f7fbff 55%,#edf6ff 100%);
 color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;padding:16px 18px 18px;color:#fff;
 background:linear-gradient(135deg,var(--blue2),var(--blue));box-shadow:0 4px 18px rgba(0,0,0,.12)}
.header-row{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:25px;letter-spacing:-.4px}.sub{opacity:.9;font-size:13px;margin-top:4px}
.header-pill{background:rgba(255,255,255,.16);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
main{max-width:980px;margin:auto;padding:14px 14px 44px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;position:sticky;top:86px;z-index:15}
nav button{border:1px solid #dce7f2;border-radius:14px;padding:11px 8px;background:rgba(255,255,255,.95);
 color:var(--blue2);font-weight:800;box-shadow:0 3px 12px rgba(24,63,110,.08)}
nav button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--shadow);border:1px solid rgba(219,230,242,.75)}
.hero{padding:22px;background:linear-gradient(135deg,#fff,#eaf4ff);overflow:hidden}
.hero h2{font-size:29px;margin:0 0 7px}.hero p{margin:0;color:var(--muted);line-height:1.45}
.hero-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.btn{border:0;border-radius:15px;padding:13px 14px;background:#fff;color:var(--blue2);font-weight:800;
 box-shadow:0 3px 12px rgba(24,63,110,.10);border:1px solid #dce7f2}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.gold{background:#fff5d9;color:#8a5a00;border-color:#f5d37b}
.btn.green{background:#e9f8f0;color:#087348;border-color:#a9ddc2}
.big{font-size:34px;font-weight:900;letter-spacing:-1px}.score{font-size:28px;font-weight:900}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.stat{padding:14px;border-radius:17px;background:#f5f9fd;border:1px solid #e4edf6}
.stat strong{display:block;font-size:20px;margin-top:2px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.section-title h3{margin:0;font-size:18px}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 1px 6px}
.chip{border:1px solid #d9e5f1;background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;color:var(--blue2);white-space:nowrap}
input,select{width:100%;padding:14px;border:1px solid #cddbea;border-radius:14px;font-size:16px;background:#fff;margin:4px 0}
.searchbox{position:relative}.searchbox span{position:absolute;right:14px;top:14px}
.country{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid #edf1f5;min-height:90px}
.country:last-child{border-bottom:0}
.flag{display:flex;justify-content:center;align-items:center;flex:0 0 auto}
.flagimg{width:88px;height:60px;object-fit:contain;border-radius:7px;box-shadow:0 3px 10px rgba(16,36,62,.16);background:#f7fafc}
.country strong{display:block;font-size:16px}.country .small{display:block;margin-top:3px}
.country:hover{background:#f7fbff;border-radius:14px}
.country-card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini-country{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}
.mini-country .flagimg{width:62px;height:43px}.mini-country strong{font-size:14px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9f2ff;color:var(--blue2);font-size:11px;font-weight:800;margin:2px 3px 2px 0}
.detail-flag{text-align:center;padding:10px 0 2px}.detail-flag .flagimg{width:240px;height:160px;border-radius:12px}
.detail-title{text-align:center;font-size:29px;margin:9px 0 4px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.info{padding:15px;border-radius:16px;background:#f7faff;border:1px solid #e3edf7}.info .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.info strong{display:block;margin-top:5px;font-size:16px}
.world-wrap{overflow:auto;max-height:68vh;border-radius:18px;background:#dff3ff;border:1px solid #c6dfea;padding:4px}
.world-svg{display:block;width:100%;min-width:760px;height:auto}.world-svg .country-shape{transition:fill .12s}
.world-svg .country-shape.clickable:hover,.world-svg .country-shape.clickable:focus{fill:#ffd45c;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.map-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.map-toolbar .btn{flex:1;min-width:140px}
.map-tip{font-size:13px;margin-top:10px;text-align:center;color:#5e7180}
.quiz-flag{display:flex;justify-content:center;align-items:center;min-height:190px;padding:14px}
.quiz-flag .flagimg{width:300px;height:200px;border-radius:14px}
.quiz-question{text-align:center;font-size:19px;font-weight:850;margin:4px 0 14px}
.option{width:100%;text-align:left;margin:7px 0;padding:15px;border:1px solid #d5e0e8;border-radius:14px;background:#fff;font-size:16px;font-weight:750}
.option.correct{background:#e8f7ed;border-color:#65c68a}.option.wrong{background:#fdecec;border-color:#e18b8b}
.result{margin-top:12px;padding:14px;border-radius:14px;font-weight:700}
.success{background:#e9f8f0;color:#087348}.failure{background:#fff1f1;color:#9b2727}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:145px}
.continent-card{padding:16px;border-radius:18px;background:linear-gradient(135deg,#fff,#f1f7ff);border:1px solid var(--line)}
.continent-card .emoji{font-size:28px}.continent-card strong{display:block;margin-top:6px}.continent-card span{font-size:12px;color:var(--muted)}
.continent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.progressbar{height:11px;background:#e5edf5;border-radius:999px;overflow:hidden;margin-top:7px}.progressbar div{height:100%;background:linear-gradient(90deg,var(--blue),#4aa4ff);border-radius:999px}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.badge-card{padding:15px;border-radius:17px;border:1px solid var(--line);background:#fff}.badge-card.locked{opacity:.45;filter:grayscale(1)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.footer-note{text-align:center;color:#7890a6;font-size:11px;margin:24px 0 0}
@media(min-width:700px){
 nav{grid-template-columns:repeat(7,1fr);top:89px}
 .hero-actions{grid-template-columns:repeat(4,1fr)}
 .country-card-grid{grid-template-columns:repeat(3,1fr)}
 .continent-grid{grid-template-columns:repeat(3,1fr)}
 .badges{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:420px){
 .detail-flag .flagimg{width:210px;height:140px}.quiz-flag .flagimg{width:260px;height:174px}
}

/* DELUXE VISUAL UPGRADE */
body{background:
 radial-gradient(circle at 8% 5%,rgba(88,189,255,.20),transparent 24%),
 radial-gradient(circle at 92% 12%,rgba(255,205,76,.18),transparent 20%),
 linear-gradient(180deg,#eef9ff 0%,#f8fcff 50%,#eef7ff 100%)}
header{background:linear-gradient(135deg,#063b8e 0%,#0878d1 52%,#19a9e8 100%);padding:15px 16px 17px}
.header-row{max-width:1120px}.header-pill{font-size:13px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25)}
main{max-width:1120px;padding-bottom:60px}
nav{grid-template-columns:repeat(4,1fr);gap:7px;top:83px}
nav button{min-height:48px;font-size:12px;background:rgba(255,255,255,.94);transition:.18s transform,.18s box-shadow}
nav button:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(20,100,210,.14)}
nav button.active{background:linear-gradient(135deg,#1268d7,#159de8);box-shadow:0 6px 16px rgba(20,100,210,.24)}
.card{border-radius:24px;box-shadow:0 10px 34px rgba(22,74,121,.10)}
.hero{background:linear-gradient(135deg,#fff 5%,#e5f5ff 60%,#eaf0ff 100%);position:relative}
.hero:after{content:"🌎";position:absolute;right:-12px;top:-28px;font-size:130px;opacity:.09;transform:rotate(-12deg)}
.big{font-size:38px}
.world-card{padding:10px;background:linear-gradient(145deg,#075ca8,#0a9ad2);color:white;border:0}
.world-card h2{margin:8px 8px 3px}.world-card p{margin:0 8px 12px;opacity:.9}
.world-wrap{background:linear-gradient(#1aa5df,#0477bd);border:4px solid #fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);padding:0;max-height:none}
.world-svg{min-width:900px;border-radius:18px}
.world-svg .ocean{fill:url(#oceanGradient)}
.world-svg .country-shape{fill:#f5c95b;stroke:#fff;stroke-width:.7;cursor:pointer}
.world-svg .country-shape.clickable:hover{fill:#ffef70;filter:drop-shadow(0 0 5px rgba(255,255,255,.7))}
.map-labels text{font-family:system-ui,sans-serif;font-weight:900;fill:#fff;paint-order:stroke;stroke:#1b5d8b;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.map-labels .continent-pill{fill:rgba(18,100,210,.92);stroke:#fff;stroke-width:2}
.map-labels .asia{fill:#7c3aed}.map-labels .africa{fill:#f59e0b}.map-labels .europe{fill:#1686e8}.map-labels .na{fill:#ec4899}.map-labels .sa{fill:#f97316}.map-labels .oceania{fill:#16a05b}
.map-toolbar{display:grid;grid-template-columns:repeat(3,1fr)}
.map-toolbar .btn{min-width:0}
.continent-tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}
.continent-tabs button{border:1px solid #d9e7f4;background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;color:#154a82}
.continent-tabs button.active{background:#1268d7;color:#fff;border-color:#1268d7}
.continent-grid{grid-template-columns:repeat(2,1fr)}
.continent-card{min-height:150px;text-align:left;position:relative;overflow:hidden;transition:.18s transform}
.continent-card:hover{transform:translateY(-3px)}
.continent-card:after{content:"";position:absolute;right:-15px;bottom:-30px;font-size:105px;opacity:.10}
.continent-card[data-c="Asia"]:after{content:"🐼"}.continent-card[data-c="Africa"]:after{content:"🦁"}
.continent-card[data-c="Europe"]:after{content:"🏰"}.continent-card[data-c="North America"]:after{content:"🗽"}
.continent-card[data-c="South America"]:after{content:"🦙"}.continent-card[data-c="Oceania"]:after{content:"🦘"}
.continent-card[data-c="Antarctica"]:after{content:"🐧"}
.feature-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.quick-game{display:flex;align-items:center;gap:12px;padding:13px;border-radius:16px;border:1px solid #dbe8f4;background:#fbfdff;margin:8px 0;text-align:left}
.quick-game .qemoji{font-size:25px;width:35px;text-align:center}.quick-game strong{display:block}.quick-game span{font-size:11px;color:var(--muted)}
.fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fact{padding:14px;border-radius:17px;background:linear-gradient(135deg,#f7fbff,#eef7ff);border:1px solid #deebf6}
.fact .icon{font-size:24px}.fact strong{display:block;margin-top:5px}.fact span{font-size:12px;color:var(--muted);line-height:1.35}
.landmark{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;border:1px solid #e2ebf4}
.landmark .photo{font-size:42px;width:62px;height:58px;display:flex;align-items:center;justify-content:center;background:#eef7ff;border-radius:14px}
.challenge-card{background:linear-gradient(135deg,#32156f,#7b32c9);color:#fff;border:0}
.challenge-card .btn{background:#fff;color:#54218f;border:0}
.level-ring{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#3ed68a var(--pct),#dbe7ef 0);position:relative}
.level-ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
.level-ring span{position:relative;z-index:1;color:#173b64;font-weight:900;text-align:center;font-size:13px}
@media(min-width:700px){
 nav{grid-template-columns:repeat(7,1fr)}
 .continent-grid{grid-template-columns:repeat(3,1fr)}
 .feature-grid{grid-template-columns:1.2fr 1fr 1fr}
}
@media(max-width:699px){.feature-grid{grid-template-columns:1fr}.big{font-size:32px}.map-toolbar{grid-template-columns:1fr 1fr}.map-toolbar button:last-child{grid-column:span 2}}

</style>
</head>

function flagCode(flag){
 const chars=[...(flag||"")].filter(ch=>{
   const cp=ch.codePointAt(0);
   return cp>=0x1F1E6 && cp<=0x1F1FF;
 });
 return chars.length===2 ? chars.map(ch=>String.fromCharCode(ch.codePointAt(0)-0x1F1E6+65)).join("").toLowerCase() : "";
}
function flagImg(c,size=160){
 const code=flagCode(c.flag);
 return code ? `<img class="flagimg" src="https://flagcdn.com/w${size}/${code}.png" alt="Flag of ${esc(c.name)}">` : `<span class="flag">🌐</span>`;
}

function save(){
 localStorage.setItem('arjunWorldState',JSON.stringify(state));
 updateHeader();
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function flagCode(flag){
 if(!flag) return '';
 return [...flag].map(ch=>{
   const cp=ch.codePointAt(0)-127397;
   return cp>=65&&cp<=90?String.fromCharCode(cp):'';
 }).join('').toLowerCase();
}
function flagImg(c,size=160){
 const code=flagCode(c.flag);
 return code?`<img class="flagimg" src="https://flagcdn.com/w${size}/${code}.png" alt="${esc(c.name)} flag" loading="lazy">`:`<span class="flagimg" style="display:flex;align-items:center;justify-content:center">🌐</span>`;
}
function countryCount(continent){
 return countries.filter(c=>c.continent===continent).length;
}
function isFav(name){return (state.favorites||[]).includes(name)}
function toggleFav(name){
 state.favorites=state.favorites||[];
 if(isFav(name)) state.favorites=state.favorites.filter(x=>x!==name);
 else state.favorites.push(name);
 save();
 showCountry(countries.findIndex(c=>c.name===name));
}
function addSeen(name){
 state.seenNames=state.seenNames||[];
 if(!state.seenNames.includes(name)) state.seenNames.push(name);
 state.seen=state.seenNames.length;
}
function page(p){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 if(p==='home')home();
 else if(p==='explore')explore();
 else if(p==='map')mapPage();
 else if(p==='learn')learnPage();
 else if(p==='quiz')quiz('flag');
 else if(p==='capital')quiz('capital');
 else progress();
 window.scrollTo({top:0,behavior:'smooth'});
}

function quiz(kind){
 const correct=(currentQuiz&&currentQuiz.kind===kind&&currentQuiz.correct)?currentQuiz.correct:pick(countries);
 currentQuiz={kind,correct};
 const pool=countries.filter(x=>x!==correct),choices=[correct];
 while(choices.length<4){
   const candidate=pick(pool),answer=kind==='flag'?candidate.name:candidate.capital;
   if(!choices.some(x=>(kind==='flag'?x.name:x.capital)===answer))choices.push(candidate);
 }
 choices.sort(()=>Math.random()-.5);
 const question=kind==='flag'
   ? `<div class="quiz-flag">${flagImg(correct,320)}</div><div class="quiz-question">Which country has this flag?</div>`
   : `<div class="quiz-question">What is the capital of ${esc(correct.name)}?</div>`;
 app.innerHTML=`<div class="card"><div class="small muted">🧠 CHALLENGE</div><h2>${kind==='flag'?'🚩 Flag Quiz':'🏛️ Capital Quiz'}</h2>${question}<div id="opts"></div><div id="result"></div></div>
 <div class="card"><div class="small muted">⭐ Current XP</div><div class="score">${state.points||0}</div><p class="small muted">Correct answers give +10 XP and build your streak.</p></div>`;
 const box=document.getElementById('opts');
 choices.forEach(o=>{
   const btn=document.createElement('button');btn.className='option';btn.type='button';
   btn.textContent=kind==='flag'?o.name:o.capital;
   btn.addEventListener('click',()=>answerQuiz(btn,kind==='flag'?o.name:o.capital));
   box.appendChild(btn);
 });
}
function answerQuiz(btn,answer){
 const c=currentQuiz.correct,correct=currentQuiz.kind==='flag'?c.name:c.capital;
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 if(answer===correct){
  btn.classList.add('correct');state.points=(state.points||0)+10;state.streak=(state.streak||0)+1;state.best=Math.max(state.best||0,state.streak);
  document.getElementById('result').innerHTML=`<div class="result success">Correct! 🎉 +10 XP<br><span class="small">Streak: ${state.streak} 🔥</span></div>`;
 }else{
  btn.classList.add('wrong');state.streak=0;
  document.getElementById('result').innerHTML=`<div class="result failure">Not quite. The correct answer is <b>${esc(correct)}</b>.</div>`;
 }
 save();
 document.getElementById('result').innerHTML+=`<button class="btn primary" style="margin-top:10px;width:100%" onclick="quiz('${currentQuiz.kind}')">Next question →</button>`;
}

 <div class="card world-card"><div class="world-wrap" id="continentMap">${enhancedMapSvg()}</div></div>
 <div class="section-title"><h3>✨ Things to know</h3></div>
 <div class="fact-grid"><div class="fact"><div class="icon">${info.animal}</div><strong>Famous wildlife</strong><span>${info.animal} is one of the animals associated with this region.</span></div>
 <div class="fact"><div class="icon">🏛️</div><strong>Famous landmark</strong><span>${info.landmark}</span></div>
 <div class="fact"><div class="icon">🧭</div><strong>Geography</strong><span>${info.region}</span></div>
 <div class="fact"><div class="icon">💡</div><strong>Explorer tip</strong><span>Pick three countries and remember their flags, capitals and currencies.</span></div></div>
 <div class="section-title"><h3>📍 Countries in ${name}</h3></div>
 <div class="country-card-grid">${sample.map(c=>`<button class="mini-country" onclick="showCountry(${countries.indexOf(c)})">${flagImg(c,80)}<div><strong>${esc(c.name)}</strong><span class="small muted">${esc(c.capital)}</span></div></button>`).join('')}</div>
 <div class="actions"><button class="btn primary" onclick="quizContinent('${esc(name)}','flag')">🚩 ${name} Flag Challenge</button><button class="btn gold" onclick="quizContinent('${esc(name)}','capital')">🏛️ Capital Challenge</button></div>`;
 bindMap('continentMap',name);
}
function quizContinent(name,kind){state.quizContinent=name;quiz(kind)}
function quiz(kind){
 let pool=(state.quizContinent?continentCountries(state.quizContinent):countries);
 if(pool.length<4) pool=countries;

 // A country selected from a profile is a one-time forced question.
 let correct=null;
 if(currentQuiz && currentQuiz.kind===kind && currentQuiz.correct && currentQuiz.forced){
   correct=currentQuiz.correct;
   currentQuiz.forced=false;
 }
 if(!correct){
   state.quizHistory=state.quizHistory||{};
   state.quizHistory[kind]=state.quizHistory[kind]||[];
   const history=state.quizHistory[kind];

   // Avoid recent repeats. When the pool is exhausted, start a fresh cycle.
   let fresh=pool.filter(c=>!history.includes(c.name));
   if(fresh.length<1){
     state.quizHistory[kind]=[];
     fresh=pool;
   }
   correct=pick(fresh);
   history.push(correct.name);
   // Keep a short memory so the same country cannot immediately reappear.
   state.quizHistory[kind]=history.slice(-Math.min(10,Math.max(0,pool.length-1)));
 }
 currentQuiz={kind,correct,forced:false};

 const choices=[correct];
 while(choices.length<4){
   const o=pick(pool),ans=quizAnswer(o,kind);
   if(!choices.some(x=>quizAnswer(x,kind)===ans)) choices.push(o);
 }
 choices.sort(()=>Math.random()-.5);

 let q='';
 if(kind==='flag')q=`<div class="quiz-flag">${flagImg(correct,320)}</div><div class="quiz-question">Which country has this flag?</div>`;
 else if(kind==='capital')q=`<div class="quiz-flag">${flagImg(correct,240)}</div><div class="quiz-question">What is the capital of ${esc(correct.name)}?</div>`;
 else q=`<div class="quiz-flag"><div style="font-size:72px">💰</div></div><div class="quiz-question">Which currency is used in ${esc(correct.name)}?</div>`;

 app.innerHTML=`<div class="card"><div class="small muted">🎮 ${state.quizContinent?esc(state.quizContinent)+' ':''}CHALLENGE</div><h2>${kind==='flag'?'🚩 Flag Quiz':kind==='capital'?'🏛️ Capital Quiz':'💰 Currency Quiz'}</h2>${q}<div id="opts"></div><div id="result"></div></div>
 <div class="card"><div class="small muted">⭐ XP</div><div class="score">${state.points||0}</div><p class="small muted">Correct answer = +10 XP • Build a streak to earn badges.</p></div>`;

 const box=document.getElementById('opts');
 choices.forEach(o=>{
   const b=document.createElement('button');
   b.className='option';
   b.textContent=quizAnswer(o,kind);
   b.onclick=()=>answerQuiz(b,quizAnswer(o,kind));
   box.appendChild(b);
 });
 save();
}
function quizAnswer(c,kind){return kind==='flag'?c.name:kind==='capital'?c.capital:`${c.currency.name} (${c.currency.code})`}
function challenge(){
 const c=pick(countries), clueType=pick(['continent','capital','currency','landmark']);
 let clue=clueType==='continent'?`I am in ${c.continent}.`:clueType==='capital'?`My capital is ${c.capital}.`:clueType==='currency'?`People use ${c.currency.name} (${c.currency.code}) here.`:`A famous landmark here is ${LANDMARKS[c.name]||CONTINENT_INFO[c.continent]?.landmark}.`;
 const choices=[c];while(choices.length<4){const o=pick(countries);if(!choices.some(x=>x.name===o.name))choices.push(o)}choices.sort(()=>Math.random()-.5);
 app.innerHTML=`<div class="card challenge-card"><div class="small">🕵️ WHERE IN THE WORLD?</div><h2>Can you solve the clue?</h2><p style="font-size:20px">${esc(clue)}</p><p>Choose the country:</p><div id="challengeOpts"></div><div id="challengeResult"></div></div>`;
 const box=document.getElementById('challengeOpts');choices.forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.name;b.onclick=()=>{document.querySelectorAll('#challengeOpts .option').forEach(x=>x.disabled=true);if(o===c){b.classList.add('correct');addXP(20);state.streak=(state.streak||0)+1;state.best=Math.max(state.best||0,state.streak);document.getElementById('challengeResult').innerHTML='<div class="result success">Brilliant! 🌟 +20 XP</div>'}else{b.classList.add('wrong');state.streak=0;document.getElementById('challengeResult').innerHTML=`<div class="result failure">The answer is <b>${esc(c.name)}</b>.</div>`}save();document.getElementById('challengeResult').innerHTML+=`<button class="btn" style="margin-top:10px;width:100%" onclick="challenge()">Next clue →</button>`};box.appendChild(b)})
}
function currencyQuiz(){quiz('currency')}
function favorites(){
 const arr=(state.favorites||[]).map(n=>countries.find(c=>c.name===n)).filter(Boolean);
 app.innerHTML=`<div class="card"><h2>❤️ Favorite countries</h2><p class="small muted">Countries Arjun wants to remember.</p></div>${arr.length?`<div class="country-card-grid">${arr.map(c=>`<button class="mini-country" onclick="showCountry(${countries.indexOf(c)})">${flagImg(c,80)}<div><strong>${esc(c.name)}</strong><span class="small muted">${esc(c.capital)}</span><span class="small muted">💰 ${esc(c.currency.name)}</span></div></button>`).join('')}</div>`:'<div class="card empty">No favorites yet. Open a country and tap ❤️ Favorite.</div>'}`;
}
function progress(){
 const L=levelInfo(),seen=state.seen||0,pct=Math.round(seen/countries.length*100),badges=[
 ['🌱','First Steps',seen>=1],['🧭','Explorer',seen>=10],['🌍','World Explorer',seen>=50],['🚀','Global Genius',seen>=100],
 ['🚩','Flag Expert',(state.flagCorrect||0)>=10],['💰','Currency Pro',(state.currencyCorrect||0)>=10],['🔥','On Fire',(state.best||0)>=5],['❤️','Collector',(state.favorites||[]).length>=5]
 ];
 app.innerHTML=`<div class="card"><h2>🏆 Your Explorer Journey</h2><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="level-ring" style="--pct:${L.pct}%"><span>LEVEL<br>${L.level}</span></div><div><div class="big">${L.xp} XP</div><div class="small muted">${L.next-L.xp} XP to Level ${L.level+1}</div><div class="progressbar" style="width:260px"><div style="width:${L.pct}%"></div></div></div></div>
 <div class="grid" style="margin-top:18px"><div class="stat"><span class="small muted">Countries discovered</span><strong>${seen}/${countries.length}</strong></div><div class="stat"><span class="small muted">Best streak</span><strong>🔥 ${state.best||0}</strong></div><div class="stat"><span class="small muted">Lessons</span><strong>${state.learned||0}</strong></div><div class="stat"><span class="small muted">Favorites</span><strong>❤️ ${(state.favorites||[]).length}</strong></div></div>
 <div style="margin-top:18px"><strong>🌍 World coverage — ${pct}%</strong><div class="progressbar"><div style="width:${pct}%"></div></div></div></div>
 <div class="section-title"><h3>🎖️ Achievements</h3></div><div class="badges">${badges.map(b=>`<div class="badge-card ${b[2]?'':'locked'}"><div style="font-size:30px">${b[0]}</div><strong>${b[1]}</strong><div class="small muted">${b[2]?'Unlocked!':'Keep exploring'}</div></div>`).join('')}</div>`;
}
function learnPage(){const c=pick(countries);state.learned=(state.learned||0)+1;save();const lm=LANDMARKS[c.name]||CONTINENT_INFO[c.continent]?.landmark||'A special place to discover';app.innerHTML=`<div class="hero card"><div class="small muted">📚 COUNTRY SPOTLIGHT</div><div class="detail-flag">${flagImg(c,320)}</div><div class="detail-title">${esc(c.name)}</div><div style="text-align:center"><span class="badge">${esc(c.continent)}</span><span class="badge">${esc(c.currency.code)}</span></div>
 <div class="info-grid"><div class="info"><div class="label">🏛️ Capital</div><strong>${esc(c.capital)}</strong></div><div class="info"><div class="label">💰 Currency</div><strong>${esc(c.currency.name)}</strong><span class="small muted">${esc(c.currency.code)}</span></div><div class="info"><div class="label">🗺️ Continent</div><strong>${esc(c.continent)}</strong></div><div class="info"><div class="label">🏛️ Landmark</div><strong>${esc(lm)}</strong></div></div>
 <div class="actions"><button class="btn primary" onclick="showCountry(${countries.indexOf(c)})">Open profile</button><button class="btn gold" onclick="learnPage()">Another country →</button></div></div>
 <div class="card"><h3>💡 Explorer mission</h3><p>Try to remember <b>${esc(c.name)}</b> by its flag, capital <b>${esc(c.capital)}</b> and currency <b>${esc(c.currency.name)}</b>.</p></div>`}
function showCountry(i){
 const c=countries[i];if(!c)return;addSeen(c.name);save();const lm=LANDMARKS[c.name]||CONTINENT_INFO[c.continent]?.landmark||'Explore the region';const animal=CONTINENT_INFO[c.continent]?.animal||'🌎';
 app.innerHTML=`<div class="card"><div class="detail-flag">${flagImg(c,320)}</div><div class="detail-title">${esc(c.name)}</div><div style="text-align:center"><span class="badge">${esc(c.continent)}</span><span class="badge">${esc(c.un_status||'UN member')}</span></div>
 <div class="info-grid"><div class="info"><div class="label">🏛️ Capital</div><strong>${esc(c.capital)}</strong></div><div class="info"><div class="label">💰 Currency</div><strong>${esc(c.currency.name)}</strong><span class="small muted">${esc(c.currency.code)}</span></div><div class="info"><div class="label">🌍 Continent</div><strong>${esc(c.continent)}</strong></div><div class="info"><div class="label">🏳️ UN Status</div><strong>${esc(c.un_status||'UN member')}</strong></div></div>
 <div class="section-title"><h3>✨ Discover</h3></div><div class="fact-grid"><div class="fact"><div class="icon">${animal}</div><strong>Regional wildlife</strong><span>Explore the animals and ecosystems of ${esc(c.continent)}.</span></div><div class="fact"><div class="icon">${LANDMARK_EMOJI[lm]||'🏛️'}</div><strong>Famous landmark</strong><span>${esc(lm)}</span></div></div>
 <div class="actions"><button class="btn ${isFav(c.name)?'gold':''}" onclick="toggleFav(${JSON.stringify(c.name)})">${isFav(c.name)?'❤️ Saved':'🤍 Add favorite'}</button><button class="btn primary" onclick="quizFor(${JSON.stringify(c.name)},'flag')">🚩 Flag</button><button class="btn" onclick="quizFor(${JSON.stringify(c.name)},'capital')">🏛️ Capital</button><button class="btn green" onclick="quizFor(${JSON.stringify(c.name)},'currency')">💰 Currency</button></div></div>
 <div class="card"><h3>🧭 Continue exploring</h3><div class="actions"><button class="btn" onclick="continentPage('${esc(c.continent)}')">Explore ${esc(c.continent)}</button><button class="btn" onclick="mapPage('${esc(c.continent)}')">Map this continent</button><button class="btn" onclick="learnPage()">Random lesson</button></div></div>`;
 updateHeader();
}
function quizFor(name,kind){state.quizContinent='';currentQuiz={kind,correct:countries.find(c=>c.name===name),forced:true};quiz(kind)}
function answerQuiz(btn,answer){
 const c=currentQuiz.correct,correct=quizAnswer(c,currentQuiz.kind);document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 if(answer===correct){btn.classList.add('correct');addXP(10);state.streak=(state.streak||0)+1;state.best=Math.max(state.best||0,state.streak);if(currentQuiz.kind==='flag')state.flagCorrect=(state.flagCorrect||0)+1;if(currentQuiz.kind==='currency')state.currencyCorrect=(state.currencyCorrect||0)+1;document.getElementById('result').innerHTML=`<div class="result success">Correct! 🎉 +10 XP • 🔥 Streak ${state.streak}</div>`}
 else{btn.classList.add('wrong');state.streak=0;document.getElementById('result').innerHTML=`<div class="result failure">Not quite. The correct answer is <b>${esc(correct)}</b>.</div>`}
 save();document.getElementById('result').innerHTML+=`<button class="btn primary" style="margin-top:10px;width:100%" onclick="quiz('${currentQuiz.kind}')">Next question →</button>`;
}
function page(p){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 if(p==='home')home();else if(p==='map')mapPage();else if(p==='continents')continentsPage();else if(p==='explore')explore();else if(p==='learn')learnPage();else if(p==='quiz')quiz('flag');else if(p==='capital')quiz('capital');else if(p==='currency')quiz('currency');else if(p==='challenge')challenge();else if(p==='favorites')favorites();else progress();
 window.scrollTo({top:0,behavior:'smooth'});
}
function continentsPage(){app.innerHTML=`<div class="hero card"><div class="big">🌎 Explore the Continents</div><p>Every continent has its own landscapes, wildlife, cultures and stories. Pick one to begin.</p></div><div class="continent-grid">${Object.entries(CONTINENT_INFO).map(([n,x])=>`<button class="continent-card" data-c="${esc(n)}" onclick="continentPage('${esc(n)}')"><div class="emoji">${x.emoji}</div><strong>${n}</strong><span>${continentCountries(n).length} countries • ${x.tag}</span></button>`).join('')}</div>`}

state.favorites=state.favorites||[];state.seenNames=state.seenNames||[];state.learned=state.learned||0;state.flagCorrect=state.flagCorrect||0;state.currencyCorrect=state.currencyCorrect||0;state.quizHistory=state.quizHistory||{};
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
