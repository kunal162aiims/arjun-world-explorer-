<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1263a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arjun World">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Arjun's World Explorer</title>
<style>
:root{--blue:#1263a0;--ink:#17324d;--bg:#edf7ff;--card:#fff;--muted:#6d7f90;--good:#159447;--bad:#c83b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
header{padding:18px 18px 12px;background:linear-gradient(135deg,#1263a0,#1f86bf);color:white;position:sticky;top:0;z-index:10}
h1{margin:0;font-size:26px}.sub{opacity:.88;font-size:13px;margin-top:4px}
main{max-width:850px;margin:auto;padding:14px 14px 36px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
nav button,.btn{border:0;border-radius:14px;padding:12px 10px;background:white;color:var(--blue);font-weight:700;box-shadow:0 2px 10px #0b3a5d18}
nav button.active{background:var(--blue);color:white}
.card{background:var(--card);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 3px 16px #0b3a5d12}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.big{font-size:34px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}
input,select{width:100%;padding:13px;border:1px solid #cbd9e3;border-radius:12px;font-size:16px;background:white;margin:4px 0}
button{cursor:pointer}.primary{background:var(--blue);color:white}.success{background:var(--good);color:white}
.country{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f3}
.flag{font-size:30px;width:40px;text-align:center}.country strong{display:block}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e7f2fa;color:var(--blue);font-size:11px;font-weight:700}
.map{width:100%;border-radius:14px;display:block;background:#dff3ff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:130px}
.option{width:100%;text-align:left;margin:7px 0;padding:13px;border:1px solid #d5e0e8;border-radius:12px;background:white;font-size:15px}
.option.correct{background:#e8f7ed;border-color:#65c68a}.option.wrong{background:#fdecec;border-color:#e18b8b}
.score{font-size:22px;font-weight:800}
@media(min-width:650px){nav{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

const app=document.getElementById('app'), nav=document.getElementById('nav');
let state=JSON.parse(localStorage.getItem('arjunWorldState')||'{"points":0,"best":0,"streak":0,"seen":0}');
let currentQuiz=null;
function save(){localStorage.setItem('arjunWorldState',JSON.stringify(state))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function page(p){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 if(p==='home')home();else if(p==='explore')explore();else if(p==='map')mapPage();else if(p==='quiz')quiz('flag');else if(p==='capital')quiz('capital');else progress();
}
nav.addEventListener('click',e=>{if(e.target.dataset.page)page(e.target.dataset.page)});
function home(){
 app.innerHTML=`<div class="card"><div class="big">Hello, Arjun! 👋</div><p>Explore countries, learn capitals and test yourself.</p>
 <div class="grid"><div><div class="small muted">Points</div><div class="score">${state.points}</div></div><div><div class="small muted">Best streak</div><div class="score">${state.best}</div></div></div></div>

 <button class="btn primary" onclick="page('explore')">🌎 Find a country</button><button class="btn" onclick="page('map')">🗺️ World map</button>

}
function explore(){
 app.innerHTML=`<div class="card"><h2>Find a country</h2><input id="search" placeholder="Search country or capital…" oninput="renderCountries()">
 <select id="continent" onchange="renderCountries()"><option value="">All continents</option>${[...new Set(countries.map(c=>c.continent))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="list"></div>`;
 renderCountries();
}
function renderCountries(){
 const q=(document.getElementById('search').value||'').toLowerCase(),ct=document.getElementById('continent').value;
 const arr=countries.map((c,i)=>({c,i})).filter(x=>(!q||x.c.name.toLowerCase().includes(q)||x.c.capital.toLowerCase().includes(q))&&(!ct||x.c.continent===ct)).slice(0,80);
 document.getElementById('list').innerHTML=arr.map(x=>`<div class="card country" onclick="showCountry(${x.i})"><div class="flag">${x.c.flag||'🌐'}</div><div><strong>${esc(x.c.name)}</strong><span class="small muted">${esc(x.c.capital)} • ${esc(x.c.continent)}</span></div></div>`).join('')||'<div class="card">No country found.</div>';
}
function showCountry(i){
 const c=countries[i]; state.seen=(state.seen||0)+1; save();
 app.innerHTML=`<div class="card"><div class="flag">${c.flag||'🌐'}</div><h2>${esc(c.name)}</h2>
 <p><span class="badge">${esc(c.continent)}</span> <span class="badge">${esc(c.un_status||'UN member')}</span></p>
 <div class="grid"><div><div class="small muted">Capital</div><strong>${esc(c.capital)}</strong></div><div><div class="small muted">Flag</div><strong>${c.flag||'—'}</strong></div></div></div>
 <div class="actions"><button class="btn primary" onclick="page('explore')">← Countries</button><button class="btn" onclick="showCountry(${Math.floor(Math.random()*countries.length)})">🎲 Random</button></div>`;
}
function mapPage(){
 app.innerHTML=`<div class="card"><h2>World map</h2><p class="small muted">Detailed geographic reference map for learning. Use Countries to search individual countries.</p>
 <img class="map" src="world_reference_map.png" alt="World map with country boundaries"><p class="small muted">UN reference: Map No. 4651 Rev. 4, 1 July 2026.</p></div>`;
}
function quiz(kind){
 currentQuiz={kind,correct:pick(countries)};
 const c=currentQuiz.correct,pool=countries.filter(x=>x!==c);
 const opts=[c,pick(pool),pick(pool),pick(pool)].sort(()=>Math.random()-.5);
 const question=kind==='flag'
   ? `<div style="font-size:76px;text-align:center;margin:16px 0;line-height:1">${c.flag||'🌐'}</div><p style="text-align:center;font-weight:700">Which country has this flag?</p>`
   : `<p>What is the capital of <b>${esc(c.name)}</b>?</p>`;
 app.innerHTML=`<div class="card"><h2>${kind==='flag'?'🚩 Flag Quiz':'🏛️ Capital Quiz'}</h2><div>${question}</div><div id="opts"></div><div id="result"></div></div>`;
 const box=document.getElementById('opts');
 opts.forEach(o=>{
   const btn=document.createElement('button');
   btn.className='option'; btn.type='button';
   btn.textContent=kind==='flag'?o.name:o.capital;
   btn.addEventListener('click',()=>answerQuiz(btn,kind==='flag'?o.name:o.capital));
   box.appendChild(btn);
 });
}
function answerQuiz(btn,answer){
 const c=currentQuiz.correct,correct=currentQuiz.kind==='flag'?c.name:c.capital;
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 if(answer===correct){
   btn.classList.add('correct'); state.points+=10; state.streak=(state.streak||0)+1; state.best=Math.max(state.best,state.streak);
   document.getElementById('result').innerHTML='<p class="success" style="padding:12px;border-radius:12px">Correct! 🎉 +10 points</p>';
 }else{
   btn.classList.add('wrong'); state.streak=0;
   document.getElementById('result').innerHTML=`<p style="padding:12px;border-radius:12px;background:#fff2f2">Not quite. Correct answer: <b>${esc(correct)}</b></p>`;
 }
 save();
 const next=document.createElement('button');
 next.className='btn primary'; next.type='button'; next.style.cssText='margin-top:8px;width:100%'; next.textContent='Next question →';
 next.addEventListener('click',()=>quiz(currentQuiz.kind));
 document.getElementById('result').appendChild(next);
}
function progress(){
 app.innerHTML=`<div class="card"><h2>🏆 Progress</h2><div class="grid"><div><div class="small muted">Points</div><div class="score">${state.points}</div></div>

}
